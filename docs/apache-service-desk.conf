# Apache VirtualHost Configuration for SW Service Desk v1.0
# Place in /etc/apache2/sites-available/sw-service-desk.conf and run: a2ensite sw-service-desk.conf

<VirtualHost *:80>
    ServerName servicedesk.swcloudsolutions.com
    ServerAdmin sysadmin@swcloudsolutions.com
    Redirect permanent / https://servicedesk.swcloudsolutions.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName servicedesk.swcloudsolutions.com
    ServerAdmin sysadmin@swcloudsolutions.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/servicedesk.swcloudsolutions.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/servicedesk.swcloudsolutions.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # Security Headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Reverse Proxy to Node.js / Express
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSockets
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    ErrorLog ${APACHE_LOG_DIR}/sw_servicedesk_error.log
    CustomLog ${APACHE_LOG_DIR}/sw_servicedesk_access.log combined
</VirtualHost>
